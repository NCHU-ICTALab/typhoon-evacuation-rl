[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typhoon-evacuation-rl"
version = "0.1.0"
description = "Offline typhoon port-closure evacuation scheduling PoC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "gymnasium>=0.29,<2",
  "numpy>=1.26,<3",
  "sb3-contrib>=2.3,<3",
  "stable-baselines3>=2.3,<3",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools]
packages = ["typhoon"]

[tool.setuptools.package-data]
typhoon = [
  "frontend/*.html",
  "frontend/*.css",
  "frontend/*.js",
  "model_cards/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
